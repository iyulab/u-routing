name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'src/wasm.rs'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Changelog has an entry for this version
        run: bash scripts/check-changelog-entry.sh


      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false

      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          # Not 'latest': the action resolves that at run time and silently falls
          # back to v0.9.1 when the lookup fails, which predates `--features` and
          # fails the build below. Two runs three minutes apart got v0.15.0 and
          # v0.9.1 from the same pinned action.
          version: 'v0.15.0'

      - name: Build WASM package (bundler + nodejs)
        run: |
          wasm-pack build --target bundler --scope iyulab --out-dir pkg --features wasm
          wasm-pack build --target nodejs --scope iyulab --out-dir pkg-node --features wasm

      # Before publishing, not beside it: CI and this workflow run on the same
      # push, so a check that lives only in CI cannot stop a release.
      - name: Every exported function declares its parameter and return types
        run: |
          bash scripts/check-typed-dts.sh pkg/*.d.ts pkg-node/*.d.ts

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Merge nodejs target (node-compatible entry via exports map)
        run: |
          NAME=$(node -p "require('./pkg/package.json').main.slice(0,-3)")
          mkdir -p pkg/node
          cp "pkg-node/${NAME}.js" "pkg/node/${NAME}.cjs"
          cp "pkg-node/${NAME}_bg.wasm" pkg/node/
          cp "pkg-node/${NAME}.d.ts" "pkg/node/${NAME}.d.cts"
          sed -i "s|@ts-self-types=\"./${NAME}.d.ts\"|@ts-self-types=\"./${NAME}.d.cts\"|" "pkg/node/${NAME}.cjs"
          node <<'EOF'
          const fs = require("fs");
          const p = JSON.parse(fs.readFileSync("pkg/package.json", "utf8"));
          const n = p.main.slice(0, -3);
          p.exports = { ".": {
            node: { types: `./node/${n}.d.cts`, default: `./node/${n}.cjs` },
            types: `./${n}.d.ts`,
            default: `./${n}.js`,
          } };
          p.exports["./package.json"] = "./package.json";
          if (!p.files.includes("node")) p.files.push("node");
          p.sideEffects = [...(p.sideEffects || []), `./node/${n}.cjs`];
          fs.writeFileSync("pkg/package.json", JSON.stringify(p, null, 2) + "\n");
          EOF

      - name: Node smoke test (CJS require + ESM import)
        run: |
          PKG_NAME=$(node -p "require('./pkg/package.json').name")
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/pkg"
          node -e "const m = require('$PKG_NAME'); if (!Object.keys(m).length) throw new Error('empty CJS exports')"
          node --input-type=module -e "import('$PKG_NAME').then(m => { if (!Object.keys(m).length) throw new Error('empty ESM exports') })"

      - name: README examples run against the built package
        # An example written for another build target (`import init` + `await
        # init()`) passes the import check above and fails on the first line a
        # reader copies from the registry page.
        run: |
          PKG_NAME=$(node -p "require('./pkg/package.json').name")
          cd "$RUNNER_TEMP/smoke"
          node "$GITHUB_WORKSPACE/scripts/check-readme-snippets.mjs" "$PKG_NAME"

      - name: Node behaviour gate (max_vehicles is kept, never ignored)
        run: |
          PKG_NAME=$(node -p "require('./pkg/package.json').name")
          cd "$RUNNER_TEMP/smoke"
          node -e "
          const m = require('$PKG_NAME');
          const depot = { x: 0, y: 0 };
          const base = { population_size: 10, max_generations: 5, max_iterations: 20, seed: 1 };
          // Six customers of demand 10, two vehicles of 20: one route's worth
          // cannot be carried.
          const customers = [];
          for (let i = 1; i <= 6; i++) {
            const a = 2 * Math.PI * i / 6;
            customers.push({ id: i, x: Math.cos(a) * 10, y: Math.sin(a) * 10, demand: 10 });
          }
          const two = [{ capacity: 20 }, { capacity: 20 }];
          for (const method of ['nn', 'savings', 'ga', 'alns']) {
            const out = m.solve_vrp({ depot, customers, vehicles: two, method,
                                      config: Object.assign({}, base, { max_vehicles: 2 }) });
            if (out.num_vehicles > 2) throw new Error(method + ': ' + out.num_vehicles + ' routes');
            const served = out.routes.reduce((n, r) => n + r.length, 0);
            if (out.unassigned.length === 0 || served + out.unassigned.length !== 6) {
              throw new Error(method + ': unassigned ' + JSON.stringify(out.unassigned));
            }
          }
          // Without the limit the same request needs a third route, so the
          // check above measures the limit.
          for (const method of ['savings', 'ga', 'alns']) {
            const out = m.solve_vrp({ depot, customers, vehicles: two, method, config: base });
            if (out.num_vehicles !== 3) throw new Error(method + ': unlimited gave ' + out.num_vehicles);
          }

          // The length of vehicles is not a limit: a single entry states one
          // capacity, and savings/ga/alns still open as many routes as needed.
          for (const method of ['savings', 'ga', 'alns']) {
            const out = m.solve_vrp({ depot, customers, vehicles: [{ capacity: 20 }],
                                      method, config: base });
            if (!(out.num_vehicles > 1)) {
              throw new Error(method + ': a single capacity entry became a fleet cap');
            }
            if (out.unassigned.length !== 0) {
              throw new Error(method + ': unexpected unassigned ' + JSON.stringify(out.unassigned));
            }
          }
          console.log('max_vehicles behaviour gate: ok');
          "

      - name: Publish to npm
        run: |
          cd pkg
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          # 200 = published (skip), 404 = not yet (publish), anything else = the
          # registry did not answer, and guessing "not published" would re-publish.
          HTTP=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${PKG_NAME}/${PKG_VER}")
          if [ "$HTTP" = "200" ]; then
            echo "Version ${PKG_VER} already published, skipping"
          elif [ "$HTTP" = "404" ]; then
            npm publish --access public
          else
            echo "::error::the registry answered HTTP ${HTTP}, so it is unknown whether this version is published; re-run once the registry responds"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
