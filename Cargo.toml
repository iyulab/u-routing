[package]
name = "u-routing"
version = "0.6.0"
rust-version = "1.87"
edition = "2021"
authors = ["iyulab"]
license = "MIT"
repository = "https://github.com/iyulab/u-routing"
description = "Vehicle routing optimization: TSP, CVRP and VRPTW with constructive heuristics, local search, GA with Split, and ALNS."
readme = "README.md"
keywords = ["routing", "vrp", "tsp", "optimization", "logistics"]
categories = ["algorithms"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:serde_json", "dep:js-sys"]
ffi = ["dep:serde_json", "dep:libc"]

[dependencies]
u-metaheur = "0.4"
u-numflow = "0.6"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", optional = true, features = ["float_roundtrip"] }
libc = { version = "0.2", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dev-dependencies]
serde_json = { version = "1.0", features = ["float_roundtrip"] }
proptest = "1.4"

# `getrandom` is named nowhere in the source: it is declared only to turn on its
# `wasm_js` backend for wasm32, which `rand` needs to build there.
[package.metadata.cargo-machete]
ignored = ["getrandom"]
